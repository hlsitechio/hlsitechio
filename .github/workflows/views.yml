name: Update profile views badge

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/views.svg"
      - "assets/views-history.json"

permissions:
  contents: write

concurrency:
  group: views-badge
  cancel-in-progress: true

jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate badge from GitHub traffic API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-views.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets/)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/views.svg assets/views-history.json
          git commit -m "chore: update profile views badge [skip ci]"
          git push
